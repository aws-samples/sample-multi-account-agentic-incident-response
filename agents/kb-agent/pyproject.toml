[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-kb-agent"
version = "0.1.0"
description = "Strands-based KB-grounded fallback agent with Bedrock Knowledge Base retrieval"
license = { text = "MIT-0" }
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "mcp[cli]>=1.9.0",
    "boto3>=1.34.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kb_agent*"]
