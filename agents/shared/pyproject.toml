[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-agents-shared"
version = "0.1.0"
description = "Shared utilities for AI-Ops fallback agents and MCP servers"
license = { text = "MIT-0" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["agents.shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
