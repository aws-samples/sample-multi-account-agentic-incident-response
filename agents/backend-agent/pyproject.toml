[project]
name = "backend-devops-agent"
version = "0.1.0"
description = "Strands-based backend DevOps investigation agent with A2A server"
license = { text = "MIT-0" }
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "a2a-sdk>=0.2.0",
    "mcp[cli]>=1.9.0",
    "boto3>=1.35.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
